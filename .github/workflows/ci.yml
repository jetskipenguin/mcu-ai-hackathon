name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Package local demo
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          tar --exclude='__tests__' -czf countersign-demo.tar.gz \
            dist portal/data countersign/client countersign/policy data/cui \
            package.json package-lock.json .env.example README.md docs/github-actions.md

      - name: Upload local demo package
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: countersign-demo-${{ github.sha }}
          path: countersign-demo.tar.gz
          if-no-files-found: error
          retention-days: 14
